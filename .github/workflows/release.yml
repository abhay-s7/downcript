name: Release Build

# Cuts an actual GitHub Release with electron-updater-compatible artifacts
# for both Windows and macOS, triggered by pushing a version tag (see
# RELEASE.md) -- deliberately a separate workflow from windows-build.yml/
# mac-build.yml (which already run the full build + install + real-
# transcription/yt-dlp smoke test on every push to main) rather than folding
# release logic into them, so a normal `git push` never publishes anything
# and a release only ever happens from a tag an already-smoke-tested commit
# on main was given.
#
# Runs on real Windows/macOS runners for the same reason windows-build.yml/
# mac-build.yml do: PyInstaller and ffmpeg-static both produce platform-
# native binaries that cannot be validly cross-compiled between platforms.
#
# release-mac deliberately `needs: release-windows` (runs after it, not in
# parallel) rather than each job racing electron-builder's GitHub publish
# against the same tag concurrently -- electron-builder has a real,
# previously-observed bug where a single --publish always run can itself
# create two separate draft Release objects for one tag; two platforms
# publishing to the same tag at the same time only compounds that risk. This
# way at most one electron-builder publish process touches the release at a
# time, and release-mac's run finds the (by-then-existing) release and adds
# its own assets to it instead of also trying to create it.
on:
  push:
    tags:
      - "v*"

# Required for the built-in GITHUB_TOKEN to create a Release and upload
# assets to this repo -- no separate PAT/secret needs to be created for
# this. electron-builder's GitHub publish reads GH_TOKEN from the
# environment.
permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from the pushed tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          # Tag is "vX.Y.Z" -- electron-builder's GitHub publish defaults to
          # this exact "v"-prefixed convention when matching package.json's
          # version to a release, so tags must be pushed in this form.
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches package.json's version
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Tag ${{ steps.tag.outputs.tag }} does not match package.json version $pkg_version." >&2
            echo "Bump \"version\" in package.json to match before tagging (see RELEASE.md)." >&2
            exit 1
          fi

      - name: Refuse to re-publish an existing release for this tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "A GitHub Release for ${{ steps.tag.outputs.tag }} already exists -- refusing to overwrite it." >&2
            echo "Delete it first if this was a mistake, or bump the version and push a new tag instead." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64

      - name: Install Node dependencies (fetches the Windows ffmpeg-static binary)
        run: npm ci
        shell: bash

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user -r requirements.txt
        shell: bash

      - name: Build Next.js standalone server
        run: npm run build
        shell: bash

      - name: Freeze Python tools for Windows (PyInstaller)
        run: npm run build:python
        shell: bash

      - name: Download yt-dlp Windows binary
        run: ./scripts/download-yt-dlp.sh win32
        shell: bash

      - name: Verify the Windows runtime was actually generated
        run: ./scripts/verify-runtime.sh win32
        shell: bash

      - name: Sanity-check bundled binaries are real Windows PE executables
        shell: bash
        run: |
          set -euo pipefail
          for exe in \
            build-python/dist/win32/transcribe/transcribe.exe \
            build-python/dist/win32/hinglish/hinglish.exe \
            build-python/dist/win32/ensure_models/ensure_models.exe \
            vendor/yt-dlp/win32/yt-dlp.exe \
            node_modules/ffmpeg-static/ffmpeg.exe
          do
            magic="$(head -c2 "$exe" | od -An -tx1 | tr -d ' \n')"
            if [ "$magic" != "4d5a" ]; then
              echo "$exe does not start with the MZ magic bytes of a Windows PE executable (got $magic)" >&2
              exit 1
            fi
            echo "OK (PE): $exe"
          done

      # Publishes straight to a GitHub Release for this tag -- electron-
      # builder creates the release if it doesn't exist (already checked
      # above that it doesn't), uploads the NSIS installer, the .blockmap
      # differential-update file, and generates+uploads latest.yml (the
      # metadata file electron-updater actually polls for). No separate
      # "create release" step needed; --publish always does all of it.
      - name: Build and publish the Windows installer to GitHub Releases
        run: npx electron-builder --win --x64 --publish always
        shell: bash

      - name: Verify update metadata was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(dist-electron/*.exe)
          blockmaps=(dist-electron/*.blockmap)
          if [ ! -f dist-electron/latest.yml ]; then
            echo "latest.yml was not generated -- electron-updater has nothing to poll for this release." >&2
            exit 1
          fi
          if [ ${#exes[@]} -eq 0 ]; then
            echo "No installer .exe found in dist-electron/" >&2
            exit 1
          fi
          if [ ${#blockmaps[@]} -eq 0 ]; then
            echo "No .blockmap found -- differential updates won't work for this release (still a valid full update)." >&2
          fi
          echo "Release artifacts:"
          ls -la dist-electron/*.exe dist-electron/*.blockmap dist-electron/latest.yml 2>/dev/null || true

      - name: Upload build artifacts (in addition to the GitHub Release, for inspection)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: downcript-windows-release-${{ steps.tag.outputs.version }}
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
          if-no-files-found: warn

  release-mac:
    needs: release-windows
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from the pushed tag
        id: tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches package.json's version
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Tag ${{ steps.tag.outputs.tag }} does not match package.json version $pkg_version." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Node dependencies (fetches the macOS ffmpeg-static binary)
        run: npm ci

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user -r requirements.txt

      - name: Build Next.js standalone server
        run: npm run build

      - name: Freeze Python tools for macOS (PyInstaller)
        run: npm run build:python

      - name: Download yt-dlp macOS binary
        run: ./scripts/download-yt-dlp.sh darwin

      - name: Verify the macOS runtime was actually generated
        run: ./scripts/verify-runtime.sh darwin

      - name: Sanity-check bundled binaries are real macOS Mach-O executables
        run: |
          set -euo pipefail
          for exe in \
            build-python/dist/darwin/transcribe/transcribe \
            build-python/dist/darwin/hinglish/hinglish \
            build-python/dist/darwin/ensure_models/ensure_models \
            vendor/yt-dlp/darwin/yt-dlp \
            node_modules/ffmpeg-static/ffmpeg
          do
            if ! file "$exe" | grep -q "Mach-O"; then
              echo "$exe is not a Mach-O executable: $(file "$exe")" >&2
              exit 1
            fi
            echo "OK (Mach-O): $exe"
          done

      # Same rationale as the Windows job above: electron-builder creates the
      # release if it's missing, or (the expected path here, since
      # release-windows already ran) adds these assets to the existing one.
      # dmg + zip are both produced (see package.json's mac target config);
      # the zip is not a redundant artifact -- electron-updater's MacUpdater
      # refuses to apply an update at all without one (ERR_UPDATER_ZIP_FILE_NOT_FOUND).
      - name: Build and publish the macOS installer to GitHub Releases
        run: npx electron-builder --mac --arm64 --publish always

      - name: Verify update metadata was produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist-electron/*.dmg)
          zips=(dist-electron/*.zip)
          if [ ! -f dist-electron/latest-mac.yml ]; then
            echo "latest-mac.yml was not generated -- electron-updater has nothing to poll for this release on macOS." >&2
            exit 1
          fi
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No installer .dmg found in dist-electron/" >&2
            exit 1
          fi
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No .zip found -- MacUpdater cannot apply an update without one." >&2
            exit 1
          fi
          echo "Release artifacts:"
          ls -la dist-electron/*.dmg dist-electron/*.zip dist-electron/latest-mac.yml 2>/dev/null || true

      - name: Upload build artifacts (in addition to the GitHub Release, for inspection)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: downcript-macos-release-${{ steps.tag.outputs.version }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/latest-mac.yml
          if-no-files-found: warn
