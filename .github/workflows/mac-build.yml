name: macOS Desktop Build

# Builds the macOS app ON a real Mac, since PyInstaller and ffmpeg-static both
# produce platform-native binaries and cannot be cross-compiled from Windows/
# Linux. Mirrors windows-build.yml's shape (build -> package -> install ->
# real smoke test) so both platforms get the same level of proof, not just a
# "it compiled" check.
#
# runs-on: macos-latest is currently an Apple Silicon (arm64) runner, which
# matches this project's mac target (arm64-only -- see package.json's "mac"
# build config and RELEASE.md for why: PyInstaller can't cross-build a
# universal2 binary, and faster-whisper/torch don't reliably ship universal
# wheels, so genuine Intel support would need a second build on real x64
# hardware, which is a deliberately separate, not-yet-scoped decision).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "scripts/**"
      - "app/**"
      - "build-python/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/mac-build.yml"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Node dependencies (fetches the macOS ffmpeg-static binary)
        run: npm ci

      - name: Install Python build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user -r requirements.txt

      - name: Build Next.js standalone server
        run: npm run build

      - name: Freeze Python tools for macOS (PyInstaller)
        run: npm run build:python

      - name: Download yt-dlp macOS binary
        run: ./scripts/download-yt-dlp.sh darwin

      - name: Verify the macOS runtime was actually generated
        run: ./scripts/verify-runtime.sh darwin

      - name: Sanity-check bundled binaries are real macOS Mach-O executables
        run: |
          set -euo pipefail
          for exe in \
            build-python/dist/darwin/transcribe/transcribe \
            build-python/dist/darwin/hinglish/hinglish \
            build-python/dist/darwin/ensure_models/ensure_models \
            vendor/yt-dlp/darwin/yt-dlp \
            node_modules/ffmpeg-static/ffmpeg
          do
            if ! file "$exe" | grep -q "Mach-O"; then
              echo "$exe is not a Mach-O executable: $(file "$exe")" >&2
              exit 1
            fi
            echo "OK (Mach-O): $exe ($(file -b "$exe"))"
          done

      - name: Package macOS installer (dmg + zip, ad-hoc signed)
        # electron-builder auto-detects the CI=true env var GitHub Actions
        # sets and defaults to publishing a GitHub Release, which needs a
        # token we deliberately don't grant here -- this workflow uploads the
        # dmg as a build artifact instead (see below). identity: null in
        # package.json means no paid Developer ID is used; after-pack.js
        # re-signs the finished bundle ad-hoc so it can launch locally at all.
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify installer artifacts exist
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist-electron/*.dmg)
          zips=(dist-electron/*-mac.zip dist-electron/*-arm64-mac.zip)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No macOS .dmg found in dist-electron/" >&2
            exit 1
          fi
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No macOS update .zip found in dist-electron/ -- electron-updater's MacUpdater requires one." >&2
            exit 1
          fi
          echo "Installer(s) built:"
          printf '  %s\n' "${dmgs[@]}" "${zips[@]}"

      - name: Upload macOS installer artifact
        # Convenience-only (lets a human download the dmg/zip for manual
        # inspection outside a Release) -- must never gate the smoke test
        # below, which is the step that actually proves anything. GitHub's
        # Actions storage quota has a real "recalculated every 6-12 hours"
        # lag after deleting old artifacts, so a transient quota failure
        # here must not abort the rest of the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: downcript-macos-installer
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          if-no-files-found: error

      # --- Clean-install smoke test -------------------------------------
      # Everything above only proves the build completed. This section
      # actually launches the packaged .app (the same one the .dmg carries --
      # electron-builder produces the .app in dist-electron/mac-arm64/ before
      # wrapping it into the dmg/zip) and drives it through its real IPC/HTTP
      # surface, to prove the bundled runtime works, not just that it exists
      # on disk. No "install" step is needed the way Windows' NSIS /S is --
      # for a dmg the only thing an installer would do is copy the .app,
      # which launching it in place already proves.
      - name: Locate the packaged .app
        run: |
          set -euo pipefail
          app_dir=$(find dist-electron -maxdepth 2 -name "*.app" -type d | head -n1)
          if [ -z "$app_dir" ]; then
            echo "No .app bundle found under dist-electron/" >&2
            exit 1
          fi
          exe="$app_dir/Contents/MacOS/Downcript"
          if [ ! -x "$exe" ]; then
            echo "Packaged app executable not found or not executable at $exe" >&2
            exit 1
          fi
          echo "APP_EXE=$exe" >> "$GITHUB_ENV"
          echo "Packaged app executable: $exe"

      - name: Generate a self-contained synthetic test video
        run: node scripts/ci-make-test-video.mjs smoke-test.mp4

      - name: Install Playwright (CI-only; not persisted to package.json)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save playwright

      - name: Run clean-install smoke test (models:check, models:ensure, real transcription)
        run: node scripts/ci-windows-smoke-test.mjs "$APP_EXE" smoke-test.mp4

      # The smoke test above only exercises Upload (ffmpeg + Whisper) -- it
      # never calls yt-dlp. Instagram and Dailymotion both depend on the
      # bundled yt-dlp, which had never actually been invoked from inside a
      # real packaged macOS build before this step existed.
      - name: Run Dailymotion smoke test (real live URL, bundled yt-dlp)
        run: node scripts/ci-windows-dailymotion-smoke-test.mjs "$APP_EXE"

      # Persisted by electron/main.js to <userData>/logs/app.log -- grabbed
      # here regardless of outcome so a smoke-test failure's actual
      # server-side diagnostic (yt-dlp exit code/stderr, ffmpeg/transcribe
      # errors) is inspectable instead of only the generic message the UI
      # shows.
      - name: Upload persisted app log
        if: always()
        run: cp "$HOME/Library/Application Support/downcript/logs/app.log" app-log.txt 2>/dev/null || echo "no app.log found"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: macos-app-log
          path: app-log.txt
          if-no-files-found: ignore
